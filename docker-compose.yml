# Local PostgreSQL for development: `npm run db:up` (credentials match backend/.env.example)
services:
  postgres:
    image: postgres:16-alpine
    container_name: trackmyapps-postgres
    environment:
      POSTGRES_USER: trackmyapps
      POSTGRES_PASSWORD: trackmyapps
      POSTGRES_DB: trackmyapps
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trackmyapps']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
